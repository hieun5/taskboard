name: Deploy to Azure

# Manual only: run it from the Actions tab when you're ready to ship.
# 1. Builds the Docker image and pushes it to GitHub Container Registry (ghcr.io).
# 2. If Azure secrets are configured, points the Container App at the new image.
# See docs/AZURE.md for the one-time setup.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      HAS_AZURE: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - name: Skip when Azure isn't set up yet
        if: env.HAS_AZURE != 'true'
        run: echo "AZURE_CREDENTIALS secret not set; image pushed, nothing deployed. See docs/AZURE.md."
      - uses: azure/login@v2
        if: env.HAS_AZURE == 'true'
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Update the Container App
        if: env.HAS_AZURE == 'true'
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}"
